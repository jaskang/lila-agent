<!doctype html>
<!--
  PROTOTYPE — throwaway design draft of the Lila window. Not used by the app.
  Mirrors the GPUI window as of 2026-11-06 (crates/lila-app/src/ui.rs, app.rs, dialog.rs …),
  so design changes can be tried here first, then folded into the Rust code.

  The window sits on a fake macOS desktop (wallpaper + menu bar) at the app's default 1440×900,
  shrunk to fit smaller screens. The desktop, menu bar and yellow bar are not part of the design.

  Open: double-click this file (or `open crates/lila-app/prototype/lila-window.html`).
  Floating bar at the bottom: switch scene (← / →), open each panel/dialog, toggle size labels.
  Keys: ⌘I overview · ⌘, global settings · ⇧⌘, project settings · ⌘1–9 tabs · Alt+N new task · Esc close · H hide the bar.
  All data is fake and lives in memory.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lila 窗口原型</title>
<style>
:root {
  /* ---- color: Apple dark system palette, as semantic roles ---- */
  --fg: #f5f5f7;                         /* label */
  --muted: rgb(235 235 245 / .6);        /* secondary label */
  --muted-2: rgb(235 235 245 / .32);     /* tertiary label: hints, counts, shortcuts */
  --blue: #0a84ff;
  --green: #30d158;
  --red: #ff453a;
  --yellow: #ffd60a;
  --orange: #ff9f0a;
  --magenta: #bf5af2;
  --cyan: #64d2ff;
  --primary: #f5f5f7;
  --primary-fg: #111113;

  /* ---- fills: white/black at low alpha so they sit on any glass ---- */
  --bg: rgb(0 0 0 / .24);                /* wells: inputs, steppers, segmented controls */
  --hover: rgb(255 255 255 / .05);
  --accent: rgb(255 255 255 / .09);      /* selected row */
  --secondary: rgb(255 255 255 / .08);   /* chips, code, neutral tags */
  --fill: rgb(255 255 255 / .04);        /* grouped rows, inbox cards */
  --border: rgb(255 255 255 / .07);
  --sidebar-border: rgb(255 255 255 / .06);
  --hairline: inset 0 0 0 1px rgb(255 255 255 / .07);
  --sheen: inset 0 1px 0 rgb(255 255 255 / .06);   /* light catching the top edge of a raised surface */

  /* ---- materials: heavier = more structural ---- */
  --glass: rgb(24 25 28 / .86);          /* window: neutral graphite glass; the wallpaper only tints it */
  --glass-blur: blur(48px) saturate(1.15);
  --block: rgb(255 255 255 / .055);      /* overview cards: a lighter step of the window's own glass */
  --block-line: rgb(255 255 255 / .06);
  --card: var(--block);                  /* terminal card: the same material as every other card */
  --popover: rgb(32 32 37 / .84);        /* drawers, dialogs, menus float above the blocks */

  /* ---- shape ---- */
  --gap: 8px;                            /* window padding = gutter between blocks */
  --r-win: 20px;                         /* = --r-block + --gap, so corners stay concentric */
  --r-block: 12px;
  --r-ctl: 8px;                          /* buttons, inputs, rows */
  --ctl: 32px;                           /* default height of buttons, inputs, selects, steppers */
  --ctl-sm: 28px;                        /* compact buttons inside cards and rows */

  /* ---- motion ---- */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  /* ---- type scale (macOS: 13 body, 12 secondary, 11 caption) ---- */
  --t-body: 13px;
  --t-small: 12px;
  --t-caption: 11px;

  /* layout constants (ui.rs) */
  --tab-bar: 44px;
  --traffic: 84px;
  --row: 30px;

  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color: var(--fg); font: var(--t-body)/1.45 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-radius: var(--r-ctl); }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 22px; height: 22px; stroke-width: 1.5; }
.flex { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.xs { font-size: var(--t-small); }
.sm { font-size: var(--t-body); }
.mut { color: var(--muted); }
.mut2 { color: var(--muted-2); }
.b { font-weight: 600; }
.m { font-weight: 500; }

/* ---------- window ---------- */
/* fake desktop around the window: deliberately not part of the design */
#app { height: 100%; display: flex; flex-direction: column; }
body {
  background-color: #10132b;
  background-image:
    radial-gradient(ellipse 60% 50% at 18% 22%, rgb(124 58 237 / .55), transparent 70%),
    radial-gradient(ellipse 55% 45% at 82% 18%, rgb(14 165 233 / .45), transparent 70%),
    radial-gradient(ellipse 70% 55% at 70% 85%, rgb(244 114 182 / .40), transparent 70%),
    radial-gradient(ellipse 50% 40% at 25% 90%, rgb(251 146 60 / .35), transparent 70%),
    linear-gradient(160deg, #1e1b4b 0%, #0f172a 55%, #1a1033 100%);
}
.menubar { height: 28px; flex: none; padding: 0 14px; gap: 18px; font-size: 13px; color: #fff; background: rgb(20 20 30 / .35); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); }
.menubar .apple { width: 14px; height: 14px; fill: currentColor; }
.menubar .tray { margin-left: auto; gap: 14px; }
.menubar .tray svg { width: 15px; height: 15px; }
.desk { flex: 1; min-height: 0; display: grid; place-items: center; padding: 28px 32px 84px; }

.win { position: relative; display: flex; width: min(1440px, 100%); height: min(900px, 100%); padding: var(--gap); background: var(--glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: var(--r-win); overflow: hidden; box-shadow: 0 0 0 1px rgb(0 0 0 / .65), 0 30px 90px rgb(0 0 0 / .55), 0 10px 28px rgb(0 0 0 / .35); }
/* hairline + a brighter top edge: the glass catching light */
.win::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .09), inset 0 1px 0 rgb(255 255 255 / .1); pointer-events: none; z-index: 90; }
/* the gutter between blocks is the resize handle; a 2px line shows after a short hover, so passing over it doesn't flicker */
.split { width: var(--gap); flex: none; position: relative; cursor: col-resize; z-index: 5; }
.split::after { content: ""; position: absolute; left: 3px; width: 2px; top: 14px; bottom: 14px; border-radius: 1px; background: var(--blue); opacity: 0; transition: opacity 150ms ease; }
.split:hover::after { opacity: 1; transition-delay: 120ms; }
.split.drag::after { opacity: 1; transition: none; }

/* ---------- sidebar: sits straight on the glass, no card of its own ---------- */
.side { flex: none; display: flex; flex-direction: column; min-height: 0; }
/* the sidebar's content is a card like the others; the app's name sits above it, beside the traffic lights */
.side-card { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 6px;
  background: var(--block); box-shadow: inset 0 0 0 1px var(--block-line), var(--sheen); border-radius: var(--r-block); overflow: hidden; }
.side-sec { padding: 6px 10px 6px 16px; gap: 5px; }
.row.tall { height: 46px; gap: 10px; }
/* member tree: the trunk drops from the PM's tile, an elbow curves into each member */
.tree { margin-left: 27px; padding-left: 14px; }
.tree > .row { position: relative; margin: 0 8px 0 0; }
.branch { position: absolute; left: -15px; overflow: visible; pointer-events: none; }
.branch path { fill: none; stroke-width: 1.5; stroke-linecap: round; }
.branch .ln { stroke: rgb(255 255 255 / .13); }
.branch .lit { stroke: rgb(10 132 255 / .28); }
.branch .fl { stroke: var(--blue); stroke-dasharray: 4 7.5; stroke-dashoffset: var(--o); animation: flow 600ms linear infinite; }
@keyframes flow { to { stroke-dashoffset: calc(var(--o) - 11.5px); } }
.branch .lit.ask { stroke: rgb(255 69 58 / .26); }
.branch .fl.ask { stroke: var(--red); stroke-width: 2; stroke-dasharray: .5 6; animation: ask 1100ms linear infinite; }
@keyframes ask { to { stroke-dashoffset: calc(var(--o) + 6.5px); } }   /* offset grows: the dots travel back toward the trunk */
/* waiting for you: the tile breathes a red ring, slow enough to notice without nagging */
.row.waiting .cli { animation: ask-ring 1.8s ease-out infinite; }
@keyframes ask-ring { 0% { box-shadow: 0 0 0 0 rgb(255 69 58 / .55); } 70%, 100% { box-shadow: 0 0 0 5px rgb(255 69 58 / 0); } }
.side-top { height: var(--tab-bar); flex: none; padding-left: var(--traffic); padding-right: 12px; padding-bottom: var(--gap); gap: 8px; }
/* centered on the tab row: (44 − 8) / 2 − 6 = 12 below the window padding */
.traffic { position: absolute; left: calc(var(--gap) + 12px); top: calc(var(--gap) + 12px); display: flex; gap: 8px; z-index: 30; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .25); }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }
.logo { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(180deg, #fff, #d6d6dc); color: var(--primary-fg); font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 2px rgb(0 0 0 / .4); }
/* two heading levels: a section (项目, 任务, 说明) and a group inside it (进行中, 等你) */
.label { font-size: var(--t-small); font-weight: 600; color: var(--muted); }
.sublabel { font-size: var(--t-caption); font-weight: 600; color: var(--muted-2); letter-spacing: .02em; }
.row { height: var(--row); margin: 0 8px; padding: 0 8px; gap: 8px; border-radius: var(--r-ctl); cursor: default; transition: background-color 80ms ease; }
.row:hover { background: var(--hover); }
.row.on { background: var(--accent); }
.row:active { background: rgb(255 255 255 / .12); transition: none; }
/* tinted avatar: the hue on a soft wash, not a saturated block with black text */
.avatar { --c: var(--blue); width: 20px; height: 20px; flex: none; border-radius: 6px; font-size: 11px; font-weight: 600; display: grid; place-items: center;
  background: color-mix(in oklab, var(--c) 26%, transparent); color: color-mix(in oklab, var(--c) 55%, white); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 30%, transparent); }
.avatar.s32 { width: 34px; height: 34px; border-radius: 10px; font-size: 15px; }
.avatar.s16 { width: 16px; height: 16px; border-radius: 5px; font-size: 9px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.spin { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hr { height: 1px; background: var(--sidebar-border); margin: 10px 16px; flex: none; }
.side-foot { padding: 6px 0 4px; border-top: 1px solid var(--sidebar-border); flex: none; }
.scroll { overflow-y: auto; min-height: 0; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
.scroll:hover::-webkit-scrollbar-thumb { background-color: rgb(255 255 255 / .14); }

/* ---------- tags & status pill ---------- */
.tag { --c: var(--muted); display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font-size: var(--t-caption); font-weight: 600; flex: none; white-space: nowrap; color: color-mix(in oklab, var(--c) 80%, white); background: color-mix(in oklab, var(--c) 18%, transparent); }
.tag.pill { border-radius: 9px; min-width: 18px; justify-content: center; padding: 0 5px; }
.tag.danger { --c: var(--red); }
.tag.warn { --c: var(--yellow); }
.tag.ok { --c: var(--green); }
.tag.info { --c: var(--blue); }
.tag.sec { --c: rgb(235 235 245); color: var(--muted); background: var(--secondary); }
/* one place that says what state a member is in */
.st { --c: var(--muted); display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px 0 7px; border-radius: 10px; flex: none; font-size: var(--t-caption); font-weight: 600; color: color-mix(in oklab, var(--c) 85%, white); background: color-mix(in oklab, var(--c) 15%, transparent); }

/* CLI identity tile: the Claude asterisk in its orange, Codex as a neutral prompt */
.cli { width: 22px; height: 22px; flex: none; border-radius: 7px; display: grid; place-items: center; }
.cli svg { width: 13px; height: 13px; stroke-width: 2.4; }
.cli.claude { color: #f0905f; background: rgb(240 144 95 / .16); box-shadow: inset 0 0 0 1px rgb(240 144 95 / .2); }
.cli.codex { color: #e5e5ea; background: rgb(255 255 255 / .09); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1); }
.cli.sm { width: 20px; height: 20px; border-radius: 6px; }
.cli.lg { width: 36px; height: 36px; border-radius: 10px; }
.cli.lg svg { width: 18px; height: 18px; }

/* text action, like "+ Add" / "Change…": the accent color, no chrome */
.link { display: inline-flex; align-items: center; gap: 3px; color: var(--blue); font-weight: 500; border-radius: 5px; transition: color 100ms ease, opacity 100ms ease; }
.link:hover { color: #409cff; }
.link:active { opacity: .7; }
.link svg.i.sm { width: 13px; height: 13px; }

/* ---------- buttons: feedback on press, not on release ---------- */
.btn { height: var(--ctl); padding: 0 14px; gap: 6px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; font-size: var(--t-body); font-weight: 500; white-space: nowrap; transition: background-color 100ms ease, transform 120ms var(--ease-out); }
.btn:active { transform: scale(.97); }
.btn.small { height: var(--ctl-sm); padding: 0 12px; font-size: var(--t-body); border-radius: 7px; }
.btn.xs { height: 26px; width: 26px; padding: 0; border-radius: 7px; color: var(--muted); }
.btn.xs:hover { color: var(--fg); }
.btn.primary { background: var(--primary); color: var(--primary-fg); box-shadow: 0 1px 2px rgb(0 0 0 / .35); }
.btn.primary:hover { background: #fff; }
.btn.outline { background: rgb(255 255 255 / .07); box-shadow: var(--hairline), var(--sheen); }
.btn.outline:hover { background: rgb(255 255 255 / .11); }
.btn.ghost:hover { background: var(--hover); }
.btn.ghost:active { background: var(--accent); }
/* secondary action: a rounded capsule of lighter glass */
.btn.pill { border-radius: 999px; padding: 0 16px; background: rgb(255 255 255 / .08); box-shadow: var(--hairline), var(--sheen); }
.btn.pill:hover { background: rgb(255 255 255 / .12); }
.btn.pill.small { padding: 0 13px; }
.icon-btn { position: relative; width: 30px !important; height: 30px !important; border-radius: 8px !important; }
.icon-btn.on { color: var(--fg); background: rgb(255 255 255 / .08); }
.btn.danger { color: #ff6961; }

/* ---------- main column ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
/* title row and status row: the window's own padding counts as one side of the gap, so the row adds the same
   amount on its inner side. Window edge → tab = tab → card = 12px; card → status text = status text → window edge = 12px */
.tabbar { height: var(--tab-bar); flex: none; padding: 0 4px var(--gap) 0; gap: 2px; }
.tab { height: 28px; padding: 0 6px 0 8px; gap: 7px; border-radius: var(--r-ctl); color: var(--muted); cursor: default; transition: background-color 80ms ease, color 80ms ease; }
.tab:hover { background: var(--hover); color: var(--fg); }
/* the current tab is raised a step out of the glass */
.tab.on { background: rgb(255 255 255 / .09); color: var(--fg); box-shadow: var(--hairline), var(--sheen), 0 1px 3px rgb(0 0 0 / .25); }
.tab .btn.xs { width: 18px; height: 18px; border-radius: 5px; opacity: 0; transition: opacity 100ms ease; }
.tab:hover .btn.xs, .tab.on .btn.xs { opacity: 1; }
.tab .kbd { font-size: var(--t-caption); color: var(--muted-2); }
.work { flex: 1; min-height: 0; display: flex; position: relative; }
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* terminal card */
.card { flex: 1; min-height: 0; border-radius: var(--r-block); background: var(--card); box-shadow: inset 0 0 0 1px var(--block-line), var(--sheen); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow 200ms ease; }
/* state shows as a soft ring, not a loud border: the pill in the header carries the word */
.card.working { box-shadow: inset 0 0 0 1px rgb(10 132 255 / .32), var(--sheen); }
.card.blocked { box-shadow: inset 0 0 0 1px rgb(255 69 58 / .4), 0 0 0 3px rgb(255 69 58 / .08), var(--sheen); }
.card-head { height: 38px; flex: none; padding: 0 8px 0 14px; gap: 8px; border-bottom: 1px solid rgb(255 255 255 / .06); background: rgb(255 255 255 / .02); }
.term { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; font: 12.5px/1.55 var(--mono); color: #d4d4d8; white-space: pre-wrap; user-select: text; }
.term .hl { background: rgb(255 255 255 / .07); display: block; margin: 0 -8px; padding: 3px 8px; border-radius: 4px; }
.term .dim { color: #85858c; }
.term .or { color: #e88a5d; }
.term .bl { color: #7aa7ff; }
.term .gr { color: #6ad08c; }
.term .ye { color: #e7c75a; }
.term .box { display: block; border: 1px solid rgb(255 255 255 / .2); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); text-align: center; padding: 32px; }
.empty span { text-wrap: balance; }
.empty-ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); background: var(--fill); box-shadow: var(--hairline), var(--sheen); }

/* overview card */
.panel { flex: none; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
.pcard { background: var(--block); box-shadow: inset 0 0 0 1px var(--block-line), var(--sheen); border-radius: var(--r-block); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.pcard-head { height: 42px; flex: none; padding: 0 12px 0 16px; gap: 6px; }
.ctitle { font-size: var(--t-body); font-weight: 600; color: rgb(235 235 245 / .8); }
.ibx { padding: 4px 16px 14px; gap: 9px; align-items: stretch; }
.ibx + .ibx { border-top: 1px solid rgb(255 255 255 / .06); padding-top: 14px; }
.ibx .msg { line-height: 1.55; }
.sec-head { padding: 16px 16px 8px; gap: 6px; }
.sec + .sec { margin-top: 8px; }
.inbox-card { padding: 12px 12px 10px; gap: 8px; border-radius: 10px; background: var(--fill); box-shadow: var(--hairline); }
.inbox-card .msg { line-height: 1.55; }
.input { height: var(--ctl); padding: 0 12px; font-size: var(--t-body); border-radius: var(--r-ctl); border: 0; background: var(--bg); box-shadow: var(--hairline); outline: none; min-width: 0; transition: box-shadow 120ms ease; }
.input::placeholder, textarea.area::placeholder { color: var(--muted-2); }
.input:focus, textarea.area:focus, .select:focus { box-shadow: inset 0 0 0 1px rgb(10 132 255 / .8), 0 0 0 3px rgb(10 132 255 / .25); }
.task-row { padding: 7px 8px; gap: 10px; align-items: flex-start; border-radius: var(--r-ctl); cursor: default; transition: background-color 80ms ease; }
.task-row:hover { background: var(--hover); }
.task-row.on { background: var(--accent); }
.task-row .meta { padding-left: 2px; color: var(--muted-2); }
/* segmented control: the chosen segment is a raised thumb, not an inverted block */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-ctl); background: var(--bg); box-shadow: var(--hairline); }
.seg button { height: 24px; padding: 0 11px; border-radius: 6px; font-size: var(--t-small); font-weight: 500; color: var(--muted); transition: background-color 120ms ease, color 120ms ease; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: rgb(255 255 255 / .16); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .35), var(--sheen); }
.meter { height: 6px; border-radius: 3px; background: rgb(255 255 255 / .08); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.acct-ic { --c: var(--blue); width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; color: color-mix(in oklab, var(--c) 60%, white); background: color-mix(in oklab, var(--c) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 28%, transparent); }
.bar { height: 4px; border-radius: 2px; background: rgb(255 255 255 / .06); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.note { gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 8px; background: var(--fill); box-shadow: var(--hairline); }
.log-row { gap: 10px; align-items: flex-start; padding: 6px 0; }
.log-row + .log-row { border-top: 1px solid rgb(255 255 255 / .04); }


/* status bar: its own card, the same material as the overview cards, one gutter below the work area */
.status { height: 34px; flex: none; margin-top: var(--gap); padding: 0 12px 0 14px; gap: 16px; font-size: var(--t-caption); line-height: 16px; color: var(--muted); overflow: hidden;
  background: var(--block); box-shadow: inset 0 0 0 1px var(--block-line), var(--sheen); border-radius: var(--r-block); }
.st-item { gap: 6px; flex: none; }
.st-item svg.i.sm { width: 12px; height: 12px; color: var(--muted-2); }
.st-keys { display: flex; gap: 12px; color: var(--muted-2); min-width: 0; }
.st-keys > span { display: inline-flex; align-items: center; gap: 4px; flex: none; }
kbd { font: 500 10px/1 var(--sans); padding: 2px 4px; border-radius: 4px; color: var(--muted); background: rgb(255 255 255 / .07); box-shadow: inset 0 -1px 0 rgb(0 0 0 / .3), var(--hairline); }

/* ---------- drawers (new task, task detail): from under the tab bar to above the status bar ---------- */

.md li::marker { color: var(--muted-2); }
.md code { font: 11.5px var(--mono); background: var(--secondary); padding: 1px 5px; border-radius: 4px; }
.callout { padding: 10px 12px; border-radius: 8px; line-height: 1.5; }
.timeline { border-left: 1px solid rgb(255 255 255 / .1); margin-left: 4px; padding-left: 16px; gap: 10px; }

.timeline .ev:last-child::before { background: var(--blue); }

const statusColor = st => ({ working: 'var(--blue)', blocked: 'var(--red)', error: 'var(--red)', done: 'var(--green)', idle: 'var(--muted)' }[st] || 'rgb(161 161 161 / .5)');
const statusLabel = st => ({ working: '工作中', blocked: '等你', done: '刚完成', idle: '空闲', error: '出错', gone: '未运行' }[st] || '启动中');
// spinners start mid-turn, in phase with the wall clock, so a re-render never makes them jump back to 12 o'clock
const mark = st => st === 'working' ? `<span class="spin" style="color:${statusColor(st)};animation-delay:-${Math.round(performance.now() % 900)}ms"></span>` : `<span class="dot" style="background:${statusColor(st)}"></span>`;
// which CLI a member runs, as a small tile: the asterisk for Claude Code, a prompt for Codex

  ? `<span class="cli codex ${cls}" title="Codex">${I('prompt', 'sm')}</span>`

const stPill = st => `<span class="st" style="--c:${statusColor(st)}">${mark(st)}${statusLabel(st)}</span>`;
const AV = ['var(--blue)', 'var(--green)', 'var(--yellow)', 'var(--magenta)', 'var(--cyan)', 'var(--red)'];
const avatar = (name, cls = '') => { let h = 7; for (const ch of name) h = (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0; return `<span class="avatar ${cls}" style="--c:${AV[h % 6]}">${esc(name[0].toUpperCase())}</span>`; };
const stateTag = st => ({ blocked: 'danger', done: 'ok', cancelled: 'sec', queued: 'sec' }[st] || 'info');
const stateLabel = st => ({ queued: '排队', delivered: '已送达', in_progress: '进行中', blocked: '阻塞', done: '完成', cancelled: '已取消' }[st]);
function groupOf(st) { return { blocked: [0, '等你'], error: [0, '等你'], working: [1, '工作中'], done: [2, '刚完成'], idle: [3, '空闲'], unknown: [4, '启动中'] }[st] || [5, '未运行']; }
function summary(pid, v) {
  if (pid !== 'shop' || S.scene !== 'running') return { status: S.scene === 'fresh' && pid === 'temp' ? 'working' : null, inbox: 0 };

function memberRow(m, branchSvg = '') {

// The tree's lines, one SVG per member row. Two kinds of traffic, told apart by color, rhythm and direction:
// · working: blue dashes run down from the PM into the member (work going out); the trunk above it runs too.
// · waiting for you: red dots climb slowly from the member all the way back up to the PM (a question coming back),
//   and its tile pulses. Where the trunk is shared, both run on the one line: blue dashes down, red dots up.
// Dashes are anchored to the tree's own y, so they line up across rows, and their phase follows the clock, so a
// re-render never makes them jump.
const ROW_H = 46, FLOW_P = 11.5, FLOW_MS = 600, ASK_P = 6.5, ASK_MS = 1100;
function branch(i, crew) {
  const first = i === 0, last = i === crew.length - 1;
  const T = first ? 12 : 0, H = ROW_H + T, mid = T + ROW_H / 2, y0 = i * ROW_H - T;
  const lastWorking = crew.map(m => m.status).lastIndexOf('working'), lastWaiting = crew.map(m => m.status).lastIndexOf('blocked');
  const phase = (y, P = FLOW_P, ms = FLOW_MS) => `--o:${(((y % P) + P) % P).toFixed(2)}px;animation-delay:-${Math.round(performance.now() % ms)}ms`;
  const elbow = `M1 0V${mid - 8}Q1 ${mid} 9 ${mid}H17`, down = `M1 ${mid - 8}V${H}`, trunk = `M1 0V${H}`;
  const run = d => `<path class="lit" d="${d}"/><path class="fl" d="${d}" style="${phase(y0)}"/>`;
  // the red dots ride on top; the red glow under them is skipped where the trunk is already lit blue
  const ask = (d, glow = true) => `${glow ? `<path class="lit ask" d="${d}"/>` : ''}<path class="fl ask" d="${d}" style="${phase(y0, ASK_P, ASK_MS)}"/>`;
  return `<svg class="branch" width="18" height="${H}" style="top:${-T}px" aria-hidden="true">
    <path class="ln" d="${elbow}"/>${last ? '' : `<path class="ln" d="${down}"/>`}
    ${i < lastWorking ? run(trunk) : ''}${crew[i].status === 'working' ? run(elbow) : ''}
    ${i < lastWaiting ? ask(trunk, i >= lastWorking) : ''}${crew[i].status === 'blocked' ? ask(elbow) : ''}</svg>`;
}

      <div class="flex" style="gap:6px">${i.options.map(o => `<button class="btn pill small" data-act="answer" data-id="${i.id}">${esc(o)}</button>`).join('')}</div>`
    : i.kind === 'question' ? `
      <div class="flex" style="gap:6px;flex-wrap:wrap">${i.options.map(o => `<button class="btn pill small" data-act="answer" data-id="${i.id}">${esc(o)}</button>`).join('')}</div>
      <div class="flex" style="gap:6px"><input class="input grow" placeholder="或者写下你的回答…"><button class="btn primary" data-act="answer" data-id="${i.id}">回答</button></div>`
    : `<div class="flex" style="gap:6px">
        ${['terminal', 'startup', 'stalled', 'runaway'].includes(i.kind) ? `<button class="btn pill small" data-act="member" data-id="${i.member}">${I('terminal', 'sm')}打开终端</button>` : ''}
        <span class="grow"></span><button class="link sm" data-act="answer" data-id="${i.id}">知道了</button></div>`}
  </div>`;
}

function right(v) {
  const open = v.tasks.filter(t => !['done', 'cancelled'].includes(t.state)).length;
  const head = (title, n, extra = '') => `<div class="pcard-head flex"><span class="ctitle">${title}</span>${n ? `<span class="xs mut2">${n}</span>` : ''}<span class="grow"></span>${extra}</div>`;
  const groups = [['进行中', ['delivered', 'in_progress']], ['阻塞', ['blocked']], ['排队', ['queued']], ['最近完成', ['done']]]
    .map(([title, sts]) => [title, v.tasks.filter(t => sts.includes(t.state)).slice().reverse()]).filter(([, r]) => r.length);
  return `<aside class="panel" style="width:${S.rightW}px" data-anno="概览 ${S.rightW}px（300–640）">
    <section class="pcard" style="flex:none;max-height:50%">
      ${head('需要你', v.inbox.length)}
      ${v.inbox.length ? `<div class="scroll">${v.inbox.map(inboxCard).join('')}</div>`
        : `<div class="flex mut" style="padding:0 16px 14px;gap:8px">${I('circleCheck', 'sm')}<span class="sm">没有需要你处理的事</span></div>`}
    </section>
    <section class="pcard" style="flex:1;min-height:170px">
      ${head('任务', open, v.project ? `<button class="link sm" data-act="compose">${I('plus', 'sm')}新建</button>` : '')}
      <div class="scroll grow col" style="padding:0 8px 10px;gap:12px">
        ${groups.length ? groups.map(([title, rows]) => `<div class="col" style="gap:2px">
          <div class="flex" style="padding:2px 8px 4px;gap:5px"><span class="sublabel">${title}</span><span class="sublabel">${rows.length}</span></div>
          ${rows.map(t => `<div class="task-row flex ${S.drawer?.kind === 'task' && S.drawer.id === t.id ? 'on' : ''}" data-act="task" data-id="${t.id}">
            <span class="tag ${stateTag(t.state)}">${t.id}</span>
            <div class="col grow" style="align-items:stretch;gap:1px"><span class="sm trunc">${esc(t.title)}</span><span class="xs meta">${t.from} → ${t.to}</span></div>
            <span class="xs mut2" style="align-self:flex-start;padding-top:2px">${clock(t.upd)}</span></div>`).join('')}
        </div>`).join('') : '<div class="sm mut" style="padding:0 8px;line-height:1.6">还没有任务。按 ⌘N 或在左侧项目上右键「新建任务」，也可以在 PM 的终端里提需求。</div>'}
      </div>
    </section>
    <section class="pcard" style="flex:0 1 26%;min-height:84px">
      ${head('动态', 0)}
      ${v.log.length ? `<div class="scroll grow col" style="padding:0 16px 10px">${v.log.map(e => `<div class="flex xs log-row">
        <span class="mut2" style="width:34px;flex:none">${clock(e.at)}</span>
        <div class="col grow" style="align-items:stretch"><div class="flex" style="gap:4px"><span class="m">${e.actor}</span>
          ${e.task ? `<button class="link" data-act="task" data-id="${e.task}">${e.task}</button>` : ''}<span class="mut">${e.kind}</span></div>
          ${e.detail ? `<span class="mut2 trunc">${esc(e.detail)}</span>` : ''}</div></div>`).join('')}</div>`
        : '<div class="sm mut" style="padding:0 16px">还没有动静</div>'}
    </section>
  </aside>`;
}



// ---------- drawers ----------
function taskDrawer(v) {
  const t = TASKS.find(t => t.id === S.drawer.id);
  const subs = TASKS.filter(x => x.parent === t.id);
  const open = !['done', 'cancelled'].includes(t.state);
  return `<div class="drawer" data-anno="任务详情 600px">
    <div class="drawer-head flex"><span class="tag ${stateTag(t.state)}">${stateLabel(t.state)}</span><span class="b">${t.id}</span><span class="grow"></span>
      <button class="btn ghost xs" data-act="close-drawer" title="关闭 (Esc)">${I('x', 'sm')}</button></div>
    <div class="drawer-body">
      <div class="col" style="align-items:stretch;gap:6px">
        <div class="title">${esc(t.title)}</div>
        <div class="flex xs mut" style="gap:6px;flex-wrap:wrap"><span>${t.from} →</span>${mark(TEAM.find(m => m.id === t.to)?.status || 'idle')}<span style="color:var(--fg)">${t.to}</span>
          ${t.parent ? `<span>· 父任务</span><button style="color:var(--blue)" data-act="task" data-id="${t.parent}">${t.parent}</button>` : ''}
          <span>· 创建 ${clock(t.cre)} · 更新 ${clock(t.upd)}</span></div>
      </div>
      <div class="flex" style="gap:6px;flex-wrap:wrap">
        <button class="btn outline small" data-act="member" data-id="${t.to}">${I('terminal', 'sm')}打开 ${t.to} 的终端</button>
        <button class="btn ghost small">${I('file', 'sm')}打开任务文件</button>
        ${t.state === 'queued' ? '<button class="btn ghost small">改写</button>' : ''}
        ${open ? '<button class="btn ghost small" data-act="compose-sub">派子任务</button>' : ''}
        <span class="grow"></span>
        ${open ? (S.confirmCancel ? `<span class="xs mut">取消后通知 ${t.to} 和 PM</span><button class="btn outline small danger" data-act="cancel-yes">确认取消</button><button class="btn ghost small" data-act="cancel-no">算了</button>`
          : '<button class="btn ghost small danger" data-act="cancel">取消任务</button>') : ''}
      </div>
      ${t.state === 'done' ? `<div class="sm callout" style="background:rgb(48 209 88 / .12);color:#7ee2a0">完成：数据模型写在 docs/model.md，迁移脚本在 db/migrations/0002_cart.sql。</div>` : ''}
      ${t.state === 'blocked' ? `<div class="sm callout" style="background:rgb(255 69 58 / .12);color:#ff9f97">阻塞：等你回答 Q3（游客下单）。</div>` : ''}
      <div><div class="label" style="margin-bottom:8px">说明</div>
        <div class="md sm"><p>从商品页加入购物车，到下单成功的整条路径。</p>
          <h3>要做到</h3><ul><li>接口 <code>POST /cart/items</code>、<code>DELETE /cart/items/:id</code>、<code>DELETE /cart</code></li><li>库存不足时返回 409，前端提示「库存不够」</li><li>接口测试覆盖加、减、清空和库存不足</li></ul>
          <h3>参考</h3><ul><li><code>docs/model.md</code>（T5）</li></ul></div></div>
      <div><div class="label" style="margin-bottom:10px">经过</div>
        <div class="timeline col" style="align-items:stretch">
          <div class="ev xs"><span class="mut">${clock(t.cre)}</span> ${t.from} 派出</div>
          <div class="ev xs"><span class="mut">${clock(t.cre + 60000)}</span> 送达 ${t.to}</div>
          <div class="ev xs"><span class="mut">${clock(t.cre + 120000)}</span> ${t.to} 开始</div>
          ${t.state === 'done' ? `<div class="ev xs"><span class="mut">${clock(t.upd)}</span> ${t.to} 完成</div>` : ''}
        </div></div>
      ${subs.length ? `<div><div class="label" style="margin-bottom:6px">交出去的子任务</div>${subs.map(s => `<div class="task-row col" data-act="task" data-id="${s.id}">
        <div class="flex" style="gap:8px"><span class="tag ${stateTag(s.state)}">${s.id}</span><span class="sm trunc grow">${esc(s.title)}</span><span class="xs mut">${s.to}</span></div></div>`).join('')}</div>` : ''}
      <div><div class="label" style="margin-bottom:6px">交付文件</div><div class="xs mut">${t.state === 'done' ? 'docs/model.md · db/migrations/0002_cart.sql' : '还没有'}</div></div>
    </div>
  </div>`;
}

function composeDrawer(v) {
  const to = S.drawer.to || 'pm';
  const m = v.members.find(m => m.id === to);
  const hint = !m ? '' : m.status === 'idle' ? `${to} 现在空闲，会马上收到。` : `${to} 手上有任务，这个会排在后面。`;
  return `<div class="drawer" data-anno="新建任务 600px">
    <div class="drawer-head flex"><span class="b">新建任务</span>${S.drawer.parent ? `<span class="xs mut">· 父任务 ${S.drawer.parent}</span>` : ''}<span class="grow"></span>
      <button class="btn ghost xs" data-act="close-drawer">${I('x', 'sm')}</button></div>
    <div class="drawer-body">
      <div class="xs mut">交给 PM 会由它拆分分派，也可以直接派给某个成员。</div>
      <div class="col" style="align-items:stretch;gap:6px"><span class="label">派给</span>
        <select class="select" data-act="compose-to">${v.members.map(m => `<option ${m.id === to ? 'selected' : ''} value="${m.id}">${m.id} · ${role(m.id).name}</option>`).join('')}</select>
        <span class="xs mut">${hint}</span></div>
      <div class="col grow" style="align-items:stretch;gap:6px"><span class="label">内容</span>
        <textarea class="area grow" style="min-height:260px" placeholder="第一行作为任务标题，其余是说明，支持 Markdown。写清楚要做什么、给谁用、做到什么程度算完成。"></textarea></div>
      <div class="flex" style="gap:8px"><span class="label" style="width:56px">父任务</span><input class="input" style="width:200px" placeholder="可选，例如 T12" value="${S.drawer.parent || ''}"></div>
    </div>
    <div class="drawer-foot flex"><button class="btn ghost" data-act="close-drawer">取消</button><button class="btn primary" data-act="close-drawer">派出</button></div>

}

// ---------- dialogs ----------
const navRow = (act, id, icon, text, on, extra = '') => `<div class="row flex ${on ? 'on' : ''}" data-act="${act}" data-id="${id}">${I(icon, 'sm')}<span class="sm grow">${text}</span>${extra}</div>`;
const gRow = (title, sub, ctrl) => `<div class="grow-row flex"><div class="col grow" style="align-items:flex-start"><span class="sm m">${title}</span>${sub ? `<span class="xs mut">${sub}</span>` : ''}</div>${ctrl}</div>`;
const stepper = (val, unit, act, id) => `<span class="stepper"><button data-act="${act}" data-id="${id}" data-d="-1">${I('minus', 'sm')}</button><span class="sm">${val} ${unit}</span><button data-act="${act}" data-id="${id}" data-d="1">${I('plus', 'sm')}</button></span>`;
const modelSelect = sel => `<select class="select">${Object.entries(MODELS).map(([g, ms]) => `<optgroup label="${g}">${ms.map(m => `<option ${m === sel ? 'selected' : ''}>${m}</option>`).join('')}</optgroup>`).join('')}</select>`;
const effortSeg = (sel, id) => `<span class="seg">${['默认', 'low', 'medium', 'high', 'xhigh', 'max'].map(e => `<button class="${e === sel ? 'on' : ''}" style="height:26px;padding:0 12px;font-size:13px" data-act="effort" data-id="${id}" data-e="${e}">${e}</button>`).join('')}</span>`;
const dlgShell = (nav, head, body, foot) => `<div class="backdrop" data-act="backdrop"><div class="dialog" data-anno="对话框 920×640">
  <div class="dlg-nav col" style="align-items:stretch">${nav}</div>
  <div class="dlg-main">${head ? `<div class="dlg-head"><h2>${head[0]}</h2>${head[1] ? `<div class="xs mut">${head[1]}</div>` : ''}</div>` : ''}<div class="dlg-body">${body}</div>${foot ? `<div class="dlg-foot flex">${foot}</div>` : ''}</div>
  <button class="btn ghost xs dlg-close" data-act="close-dialog" title="关闭 (Esc)">${I('x', 'sm')}</button></div></div>`;

function settingsDialog(v) {
  const page = S.dialog.page;
  const team = TEAM.map(m => m.id).filter(id => id !== 'engineer-2');
  const nav = `<div class="xs mut" style="padding:0 8px">项目设置</div>
    <div class="flex" style="gap:8px;padding:4px 8px 16px">${avatar(v.project.id)}<span class="b" style="font-size:16px">${esc(v.project.label)}</span></div>
    ${navRow('settings-page', 'general', 'sliders', '通用', page === 'general')}
    ${navRow('settings-page', 'members', 'bot', '成员', page === 'members', `<span class="xs mut">${team.length}</span>`)}
    ${navRow('settings-page', 'assign', 'network', '指派规则', page === 'assign')}

    <div class="group-title">项目</div><div class="group">
      ${gRow('显示名称', '', `<input class="input" style="width:280px" value="${esc(v.project.label)}">`)}
      ${gRow('项目编号', '创建后不能改', `<span class="sm mut">${v.project.id}</span>`)}
    </div>
    <div class="group-title">位置</div><div class="group">
      ${gRow('目录', '', `<span class="sm mut">${v.project.cwd}</span>`)}
      ${gRow('配置文件', '随仓库提交', '<span class="sm mut">.lila/project.toml</span>')}
    </div></div>`, foot);
  if (page === 'assign') return dlgShell(nav, ['指派规则', ''], `<div style="padding:16px 24px 24px">
    <div class="xs mut" style="margin-bottom:12px">每一行是派活的人，勾上的列是能派给的人。你和 PM 可以派给任何人。</div>
    <div class="group" style="padding:4px 6px"><table class="matrix" style="width:100%"><tr><th>派活的人 ↓</th>${team.map(id => `<th>${id}</th>`).join('')}<th></th></tr>
    ${team.map(from => `<tr><td class="sm">${from}</td>${team.map(to => {
      const r = role(from); const on = from === 'pm' || r.to.includes(to.replace(/-\d+$/, ''));
      return `<td>${from === to ? '<span class="mut2">—</span>' : `<span class="check ${on ? 'on' : ''} ${from === 'pm' ? 'fixed' : ''}" style="margin:auto" data-act="toggle-check">${on ? I('check') : ''}</span>`}</td>`;
    }).join('')}<td>${from === 'tester' ? '<button class="xs" style="color:var(--blue)">恢复默认</button>' : ''}</td></tr>`).join('')}</table></div></div>`, foot);
  if (page === 'rules') {
    const r = S.settings.rules;
    return dlgShell(nav, ['运行规则', ''], `<div style="padding:0 24px 24px">
      <div class="group-title">派发</div><div class="group">
        ${gRow('换任务时开新会话', '换到另一条任务链时重启 CLI，清空上下文。PM 不受影响。', `<span class="switch ${r.fresh ? 'on' : ''}" data-act="rule-fresh"></span>`)}</div>
      <div class="group-title">提醒</div><div class="group">
        ${gRow('无回应提醒', '有任务却这么久没汇报就提醒它，还不回应就告诉 PM。', stepper(r.stall, '分钟', 'rule', 'stall'))}
        ${gRow('启动等待', '启动后这么久没报告状态就提醒你。', stepper(r.startup, '秒', 'rule', 'startup'))}</div>
      <div class="group-title">防失控</div><div class="group">
        ${gRow('来回返工上限', '来回退回超过这个轮数就交给 PM。', stepper(r.rounds, '轮', 'rule', 'rounds'))}
        ${gRow('子任务层数', '防止无限拆分。', stepper(r.depth, '层', 'rule', 'depth'))}</div></div>`, foot);
  }
  // members
  const sel = S.settings.member; const r = role(sel); const isPm = sel === 'pm';
  const count = S.settings.count[sel] || 1;
  const list = team.map(id => `<div class="row flex ${id === sel ? 'on' : ''}" style="height:52px;margin:0 0 2px" data-act="settings-member" data-id="${id}">
    ${cliTile(id)}<div class="col grow" style="align-items:flex-start;line-height:1.3"><span class="sm">${id}</span><span class="xs mut">${role(id).name}</span></div>
    ${id === 'pm' ? '<span class="xs m">PM</span>' : ''}${S.settings.count[id] > 1 ? `<span class="xs mut">×${S.settings.count[id]}</span>` : ''}</div>`).join('');
  return dlgShell(nav, ['成员', ''], `<div class="flex" style="align-items:stretch;height:100%">
    <div class="col" style="width:200px;flex:none;border-right:1px solid var(--border);align-items:stretch">
      <div class="scroll grow" style="padding:8px">${list}</div>

      <div class="flex" style="gap:12px">${cliTile(sel, 'lg')}

      <div class="group-title">运行</div><div class="group">
        ${gRow('模型', r.cli, modelSelect(r.model))}
        ${gRow('努力程度', '', effortSeg(S.effort?.[sel] || r.effort, sel))}</div>
      <div class="group-title">分工</div><div class="group">
        ${isPm ? gRow('同时工作', '每个项目只有一个 PM。', '<span class="sm">1 个</span>') : gRow('同时工作', '多开更快，也更费额度。', stepper(count, '个', 'count', sel))}</div>
      <div class="group-title">提示词</div><div class="group" style="padding:12px 16px">
        <div class="sm m">预设提示词</div><div class="xs mut" style="margin-bottom:8px">和角色「${r.name}」的默认提示词一样</div>
        <textarea class="area" rows="6">${isPm ? 'You are the PM of this project. You decide what gets built next, split work into tasks, hand them to the team, and report to the person.' : `You are the ${r.id} on this team. Take the task you are given, do it well, and hand it back with a short summary.`}</textarea></div>
      ${isPm ? '' : `<div style="margin-top:18px"><button class="btn outline small danger">移出团队</button> <span class="xs mut">保存后停掉它的终端，没做完的任务会取消</span></div>`}
    </div></div>`, foot);
}

const until = ms => { const m = Math.max(0, Math.round((ms - now) / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return d ? (h ? `${d} 天 ${h} 小时后` : `${d} 天后`) : h ? `${h} 小时 ${m % 60} 分后` : `${m % 60} 分钟后`; };
const when = ms => { const d = new Date(ms), t = clock(ms);
  return d.toDateString() === new Date(now).toDateString() ? `今天 ${t}` : `${d.getMonth() + 1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]} ${t}`; };
// the fill keeps the CLI's color until the quota gets tight, then warns
const meterColor = (u, c) => u >= .9 ? 'var(--red)' : u >= .75 ? 'var(--orange)' : c;
function usagePage() {
  const acct = (a, c) => `<div class="group acct ${a.current ? 'current' : ''}">
    <div class="grow-row flex"><span class="acct-ic" style="--c:${c.color}">${I('user', 'sm')}</span>
      <div class="col grow" style="align-items:flex-start;gap:1px">
        <div class="flex" style="gap:8px"><span class="sm m">${esc(a.name)}</span><span class="xs mut">${a.plan}</span>${a.magpie ? '<span class="tag" title="这个登录由 magpie 管理">magpie</span>' : ''}</div>
        <span class="xs mut2" title="${a.dir}">${a.windows.length ? `${clock(a.seen)} 更新` : '还没有记录'}</span></div>
      ${a.current ? '<span class="tag ok">正在使用</span>'
        : a.magpie ? `<button class="link sm" data-act="acct-use" data-id="${a.id}" title="由 magpie 把 ${a.cli} 自己的登录换成这个账号">设为当前</button>`
        : `<button class="link sm" data-act="acct-use" data-id="${a.id}">设为当前</button>
           ${S.rmAcct === a.id ? `<button class="btn pill small danger" data-act="acct-remove" data-id="${a.id}">确认移除</button>`
             : `<button class="btn ghost xs" data-act="acct-remove" data-id="${a.id}" title="移除这个账号（退出登录并删除它的配置目录）">${I('trash', 'sm')}</button>`}`}
    </div>
    ${a.windows.length ? a.windows.map(w => `<div class="grow-row flex">
      <span class="sm m" style="width:72px;flex:none">${w.name}</span>
      <div class="col grow" style="align-items:stretch;gap:7px">
        <div class="flex" style="gap:8px"><span class="sm m" style="color:${w.used >= .9 ? '#ff6961' : 'var(--fg)'}">已用 ${Math.round(w.used * 100)}%</span><span class="grow"></span><span class="xs mut">${until(w.reset)}重置 · ${when(w.reset)}</span></div>
        <div class="meter"><i style="width:${w.used * 100}%;background:${meterColor(w.used, c.color)}"></i></div></div>
    </div>`).join('') : `<div class="grow-row flex xs mut">有成员用它工作后才有数据。</div>`}
  </div>`;
  // Adding: name it, then sign in in the vendor's web page (the CLI's own login runs in the background).
  const addForm = c => S.signing?.cli === c.cli ? `<div class="group acct-add">

  const v = view();
  if (v.project && !v.members.find(m => m.id === S.member)) S.member = v.members[0]?.id;
  document.body.classList.toggle('anno', S.anno);
  let drawer = '';
  if (S.drawer?.kind === 'task' && v.project) drawer = taskDrawer(v);
  if (S.drawer?.kind === 'compose' && v.project) drawer = composeDrawer(v);
  let dialog = '';
  if (S.dialog?.kind === 'settings' && v.project) dialog = settingsDialog(v);

// ---------- motion ----------
// render() rebuilds the whole page, so CSS keyframes would replay on every click. Instead, surfaces animate
// with WAAPI only on the render where they first appear, and only when a pointer opened them: keyboard
// actions (⌘, ⌘I ⌘N Esc) are repeated all day and stay instant.
const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)', EASE_DRAWER = 'cubic-bezier(0.32, 0.72, 0, 1)';
const calm = matchMedia('(prefers-reduced-motion: reduce)');
let shown = {}, viaKey = false, leaving = false;
const MOTION = {
  // enter and leave along the same path: the drawer comes from the right edge and goes back there
  drawer: { sel: '.drawer', in: [{ transform: 'translateX(28px)', opacity: 0 }, { transform: 'none', opacity: 1 }], dur: 280, ease: EASE_DRAWER, out: 180 },
  // a modal isn't anchored to a trigger, so it grows from its own center
  dialog: { sel: '.dialog', in: [{ transform: 'scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }], dur: 220, ease: EASE_OUT, out: 150, scrim: '.backdrop' },
  // the menu grows out of the pointer (transform-origin: top left)
  menu: { sel: '.menu', in: [{ transform: 'scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }], dur: 140, ease: EASE_OUT },
};
const fadeOnly = f => f.map(k => ({ opacity: k.opacity }));
function motion() {
  const now = { drawer: !!S.drawer, dialog: !!S.dialog, menu: S.menu ? `${S.menu.x},${S.menu.y}` : '' };
  if (!viaKey) for (const k in MOTION) {
    if (!now[k] || now[k] === shown[k]) continue;
    const m = MOTION[k], el = document.querySelector(m.sel); if (!el) continue;
    el.animate(calm.matches ? fadeOnly(m.in) : m.in, { duration: calm.matches ? 150 : m.dur, easing: m.ease });
    if (m.scrim) document.querySelector(m.scrim)?.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' });
  }
  shown = now; viaKey = false;
}
// play the exit, then change state; faster than the entrance, because the system is responding, not the person deciding
function leave(kind, then) {
  const m = MOTION[kind], el = document.querySelector(m.sel);
  if (!el || leaving) return then();
  leaving = true;
  const back = m.in.slice().reverse();
  const a = el.animate(calm.matches ? fadeOnly(back) : back, { duration: m.out, easing: EASE_OUT, fill: 'forwards' });
  if (m.scrim) document.querySelector(m.scrim)?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: m.out, easing: 'ease-out', fill: 'forwards' });
  // a timer backs up `finished`, so a throttled or hidden page can never leave a surface stuck half-closed
  let done = false; const finish = () => { if (done) return; done = true; leaving = false; then(); };
  a.finished.then(finish); setTimeout(finish, m.out + 60);
}
const LEAVES = { 'close-drawer': 'drawer', 'cancel-yes': 'drawer', 'close-dialog': 'dialog', backdrop: 'dialog' };
// the window is 1440×900 like the app's default, shrunk to fit smaller screens; the size label says which
function labelWindow() {
  const w = document.querySelector('.win'); if (w) w.dataset.anno = `窗口 ${w.offsetWidth}×${w.offsetHeight}`;
}
addEventListener('resize', labelWindow);
const deskClock = () => new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
function menubar() {
  return `<div class="menubar flex">
    <svg class="apple" viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.8 1.3 10.3.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.2zM13.9 5c.7-.9 1.2-2 1-3.2-1 .1-2.2.7-3 1.6-.6.7-1.2 1.9-1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg>
    <span class="b">Lila</span><span>文件</span><span>编辑</span><span>显示</span><span>窗口</span><span>帮助</span>
    <div class="tray flex">${I('wifi')}${I('battery')}<span>${deskClock()}</span></div>
  </div>`;
}

  rule: (id, el) => { S.settings.rules[id] = Math.max(1, S.settings.rules[id] + +el.dataset.d); },

  effort: (id, el) => { S.effort = { ...S.effort, [id]: el.dataset.e }; },

  prefs: () => { S.dialog = { kind: 'prefs', page: 'roles' }; },
  'prefs-page': id => { S.dialog.page = id; },
  'prefs-role': id => { S.prefsRole = id; },
  'acct-add': id => { S.addAcct = id; S.rmAcct = null; },
  'acct-cancel': () => { S.addAcct = null; S.signing = null; },
  'acct-reopen': () => {},
  'acct-code': () => {},
  'acct-login': (cli, el) => {

  'wiz-back': () => { S.wizard.step--; },
  'wiz-role': id => { if (id !== 'pm') S.wizard.team[id] = S.wizard.team[id] ? 0 : 1; },
  'wiz-count': (id, el) => { S.wizard.team[id] = Math.max(1, Math.min(8, S.wizard.team[id] + +el.dataset.d)); },
  'close-dialog': () => { S.dialog = null; },
  backdrop: (_, el, ev) => { if (ev.target !== el) return false; S.dialog = null; },
  'menu-compose': id => { A.open(id); S.menu = null; A.compose(); },
  'menu-settings': id => { A.open(id); S.menu = null; A.settings(); },
  'menu-close': () => { S.menu = null; },
  scene: (_, el) => { cycle(+el.dataset.d); },
  anno: () => { S.anno = !S.anno; },
  'hide-bar': () => { S.bar = false; },
};
function cycle(d) {
  const i = SCENES.findIndex(s => s.key === S.scene);
  S.scene = SCENES[(i + d + SCENES.length) % SCENES.length].key;
  S.drawer = null; S.dialog = null; S.answered.clear();
  if (S.scene === 'fresh') S.project = 'temp';
  else if (S.scene !== 'none') { S.project = 'shop'; if (!S.tabs.includes('shop')) S.tabs.unshift('shop'); }
  history.replaceState(null, '', '?scene=' + S.scene);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (S.menu && !ev.target.closest('.menu')) { S.menu = null; if (!el) return render(); }
  if (!el || el.tagName === 'SELECT') return;
  ev.stopPropagation();
  const f = A[el.dataset.act]; if (!f) return;
  const run = () => { if (f(el.dataset.id, el, ev) !== false) render(); };
  const kind = LEAVES[el.dataset.act];
  if (kind && !(el.dataset.act === 'backdrop' && ev.target !== el)) return leave(kind, run);
  run();
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.act === 'compose-to') { S.drawer.to = ev.target.value; render(); }
});
document.addEventListener('contextmenu', ev => {
  const el = ev.target.closest('[data-project]'); if (!el) return;
  ev.preventDefault(); const r = document.querySelector('.win').getBoundingClientRect();
  S.menu = { id: el.dataset.project, x: ev.clientX - r.left, y: ev.clientY - r.top }; render();
});
document.addEventListener('keydown', ev => {
  viaKey = true; queueMicrotask(() => { viaKey = false; });
  const typing = ev.target.closest('input, textarea, select, [contenteditable]');
  if (ev.key === 'Escape') { if (S.menu) S.menu = null; else if (S.dialog) S.dialog = null; else S.drawer = null; return render(); }
  if (ev.metaKey && ev.key.toLowerCase() === 'i') { ev.preventDefault(); S.right = !S.right; return render(); }
  if (ev.metaKey && (ev.key === ',' || ev.key === '<')) { ev.preventDefault(); ev.shiftKey ? A.settings() : A.prefs(); return render(); }
  if (ev.metaKey && /^[1-9]$/.test(ev.key)) { const id = view().tabs[+ev.key - 1]; if (id) { ev.preventDefault(); A.select(id); render(); } return; }
  if (ev.altKey && ev.code === 'KeyN') { ev.preventDefault(); A.compose(); return render(); }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { cycle(ev.key === 'ArrowLeft' ? -1 : 1); render(); }
  if (ev.key === 'h' || ev.key === 'H') { S.bar = !S.bar; render(); }
});
// resizable panels
document.addEventListener('mousedown', ev => {
  const sp = ev.target.closest('[data-drag]'); if (!sp) return;
  ev.preventDefault(); sp.classList.add('drag');
  const which = sp.dataset.drag, x0 = ev.clientX, w0 = which === 'side' ? S.sideW : S.rightW;
  const el = which === 'side' ? document.querySelector('.side') : document.querySelector('.panel');
  const move = e => {
    const w = which === 'side' ? Math.max(200, Math.min(420, w0 + e.clientX - x0)) : Math.max(300, Math.min(640, w0 - (e.clientX - x0)));
    if (which === 'side') S.sideW = w; else S.rightW = w; el.style.width = w + 'px';
  };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); render(); };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
});

const q = new URLSearchParams(location.search).get('scene');
if (SCENES.some(s => s.key === q)) { S.scene = q; if (q === 'fresh') S.project = 'temp'; }
// ?open=task|compose|settings:<page>|prefs:<page>|wizard:<step>
const [o, arg] = (new URLSearchParams(location.search).get('open') || '').split(':');
if (o === 'task') A.task(arg || 'T7');
if (o === 'compose') A.compose();
if (o === 'settings') { A.settings(); if (arg && S.dialog) S.dialog.page = arg; }
if (o === 'prefs') { A.prefs(); if (arg) S.dialog.page = arg; }
if (o === 'wizard') { A.wizard(); if (arg > 1) { S.wizard.folder = '~/code/ledger'; S.wizard.step = +arg; } }
// Figma capture (generate_figma_design): hide the prototype bar, name the frame, load Figma's capture script.
const shot = new URLSearchParams(location.search).get('name');
if (location.hash.includes('figmacapture')) {
  S.bar = false;
  if (shot) document.title = shot;
  const s = document.createElement('script');
  s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
  document.head.appendChild(s);
}
render();
</script>
</body>
</html>
