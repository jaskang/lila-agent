[package]
name = "lila-app"
description = "Lila's desktop app: projects and their sessions with Claude Code, Codex and ACP agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lila-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel = "2"
chrono.workspace = true
futures = "0.3"
gpui = { package = "gpui-kit", version = "=0.9.0" }
lila = { path = "../lila" }
lila-agent = { path = "../lila-agent" }
lila-core = { path = "../lila-core" }
lila-store = { path = "../lila-store" }
lila-term = { path = "../lila-term" }
walkdir = "2"
serde.workspace = true
serde_json.workspace = true
# `shots`: the window saves a PNG of itself every 2 s to $LILA_APP_SHOT (checks without screen-recording rights).
shots-gpui = { package = "gpui-pre", version = "=0.3.11", optional = true, features = ["test-support"] }
shots-gpui-macos = { package = "gpui-pre-macos", version = "=0.3.11", optional = true, features = ["test-support"] }
png = { version = "0.17", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `shots`: logs the window buttons' size (they are not in the PNG).
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSGeometry"] }

[features]
shots = ["dep:shots-gpui", "dep:shots-gpui-macos", "dep:png", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
