[package]
name = "lila"
description = "Lila CLI and daemon (lilad)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lila"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hc-client = { path = "../hc-client" }
lila-core = { path = "../lila-core" }
lila-agent = { path = "../lila-agent" }
lila-store = { path = "../lila-store" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit = "0.25"
chrono.workspace = true
libc = "0.2"
regex = "1"
shlex = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tempfile.workspace = true
which = "8"


[dev-dependencies]
rusqlite.workspace = true
base64 = "0.22"

# A stand-in omp around the real `OmpAgents` (the test binary is the stand-in omp).
[[test]]
name = "omp"
harness = false
