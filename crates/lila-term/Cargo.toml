[package]
name = "lila-term"
description = "A herdr-core terminal in GPUI: libghostty-vt fed through `hc connect` framed attach."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel = "2"
base64 = "0.22"
fancy-regex = "0.19"
ghostty-sys = { path = "../ghostty-sys" }
gpui = { package = "gpui-kit", version = "=0.9.0", default-features = false, features = ["component"] }
png = "0.17"
serde_json.workspace = true
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true
# GPUI's test harness (TestAppContext, #[gpui::test]) for the key tests; the
# gpui-kit feature of the same name pulls in gpui-fast, which conflicts.
test-gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
