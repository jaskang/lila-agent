[package]
name = "lila-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
env_logger = "0.11"
futures-util = "0.3"
gpui-kit = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
