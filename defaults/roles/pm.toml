name = "PM（项目经理）"
runtime = "claude"
model = "claude-sonnet-5-5"
effort = "high"

# Enforced by Claude Code, not by the prompt: the PM routes work, it does not
# edit files or run builds. `only` is every built-in tool it has; `allow` runs
# without asking (anything else in Bash asks the person first).
[tools]
only = ["Read", "Grep", "Glob", "Bash"]
allow = ["Bash(lila:*)", "Bash(git status:*)", "Bash(git log:*)", "Bash(git diff --stat:*)", "Bash(git show --stat:*)"]
