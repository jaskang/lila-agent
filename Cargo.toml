[workspace]
members = ["crates/lila-core", "crates/lila-store", "crates/hc-client", "crates/lila", "crates/ghostty-sys", "crates/lila-term", "crates/lila-app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# GPUI and the terminal parse megabytes per frame: optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2

# "*" covers only non-members: the terminal walks every cell each frame, so
# it is optimized in dev builds too (unoptimized, scrolling stutters).
[profile.dev.package.lila-term]
opt-level = 2

[profile.dev.package.ghostty-sys]
opt-level = 2

[profile.dev.package.lila-app]
opt-level = 1
